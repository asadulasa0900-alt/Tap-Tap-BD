        body {

            background: radial-gradient(circle at top, #1e293b 0%, #030712 75%);

            display: flex;
            flex-direction: column;
        }

        /* 3D Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 18px;
            border: 2px solid #fef08a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .profit-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 8px 14px;
            border-radius: 24px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            text-align: right;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }

        .profit-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profit-value {
            font-size: 13px;
            font-weight: 900;
            color: #fbbf24;
        }

        /* Balance Section */
        .balance-section {
            text-align: center;
            margin-top: 25px;
        }

        .coin-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
            letter-spacing: 1px;
        }

        .mini-coin {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b 60%, #b45309 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #1e1b4b;
            font-weight: 900;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 3D League Rank Progress */
        .rank-section {
            padding: 12px 25px;
            margin-top: 8px;
        }

        .rank-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #10b981, #fbbf24, #f59e0b);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.8);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
