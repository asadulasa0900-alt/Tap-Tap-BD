<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap BD - Pro 3D Tap to Earn</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050811;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, #030712 75%);
            position: relative;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f59e0b, #b45309);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            border: 2px solid #fef08a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .profit-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 8px 14px;
            border-radius: 24px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            text-align: right;
        }

        .profit-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .profit-value {
            font-size: 13px;
            font-weight: 900;
            color: #fbbf24;
        }

        /* Balance Section */
        .balance-section {
            text-align: center;
            margin-top: 25px;
        }

        .coin-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
        }

        .mini-coin {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b 60%, #b45309 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #1e1b4b;
            font-weight: 900;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* League Rank Progress */
        .rank-section {
            padding: 12px 25px;
            margin-top: 8px;
        }

        .rank-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #10b981, #fbbf24, #f59e0b);
            border-radius: 12px;
            transition: width 0.4s ease;
        }

        /* Tap Coin Area */
        .tap-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
        }

        .tap-coin-outer {
            width: 270px;
            height: 270px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tap-coin {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fef08a 0%, #f59e0b 45%, #d97706 75%, #78350f 100%);
            border: 8px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 0 #78350f, 0 25px 40px rgba(0, 0, 0, 0.8), inset 0 10px 15px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.05s ease;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .tap-coin:active {
            transform: translateY(12px) scale(0.96);
        }

        .coin-symbol {
            font-size: 72px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .coin-subtext {
            font-size: 15px;
            font-weight: 900;
            color: #fef08a;
            letter-spacing: 3px;
        }

        /* Floating Text */
        .floating-text {
            position: fixed;
            color: #fef08a;
            font-size: 32px;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9);
            animation: floatUp 0.8s ease forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-110px) scale(1.1); }
        }

        /* Energy Bar */
        .energy-boost-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            margin-bottom: 12px;
        }

        .energy-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 800;
        }

        .boost-btn {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            border: 1px solid #fca5a5;
            padding: 10px 20px;
            border-radius: 24px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
        }

        /* Tabs */
        .tab-page {
            display: none;
            padding: 15px 20px;
        }

        .tab-page.active {
            display: block;
        }

        .section-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fbbf24;
            text-align: center;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-height: 65vh;
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .upgrade-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .upgrade-card.locked {
            opacity: 0.6;
            filter: grayscale(0.5);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card-icon {
            font-size: 26px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 12px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 800;
            color: #f8fafc;
        }

        .card-profit {
            font-size: 11px;
            color: #34d399;
            font-weight: 700;
        }

        .card-footer {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
