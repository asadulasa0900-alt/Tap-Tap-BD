<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Tap BD - Pro 3D Tap to Earn</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050811;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, #030712 75%);
            position: relative;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* 3D Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f59e0b, #b45309);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            border: 2px solid #fef08a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .profit-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 8px 14px;
            border-radius: 24px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            text-align: right;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }

        .profit-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profit-value {
            font-size: 13px;
            font-weight: 900;
            color: #fbbf24;
        }

        /* Balance Section */
        .balance-section {
            text-align: center;
            margin-top: 25px;
        }

        .coin-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
            letter-spacing: 1px;
        }

        .mini-coin {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b 60%, #b45309 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #1e1b4b;
            font-weight: 900;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 3D League Rank Progress */
        .rank-section {
            padding: 12px 25px;
            margin-top: 8px;
        }

        .rank-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #10b981, #fbbf24, #f59e0b);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.8);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Massive 3D Tap Coin Area */
        .tap-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
        }

        .tap-coin-outer {
            width: 270px;
            height: 270px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tap-coin {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fef08a 0%, #f59e0b 45%, #d97706 75%, #78350f 100%);
            border: 8px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 20px 0 #78350f, 
                0 25px 40px rgba(0, 0, 0, 0.8), 
                inset 0 10px 15px rgba(255, 255, 255, 0.6), 
                inset 0 -10px 15px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.05s ease;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .tap-coin:active {
            transform: translateY(12px) scale(0.96);
            box-shadow: 
                0 8px 0 #78350f, 
                0 12px 20px rgba(0, 0, 0, 0.8), 
                inset 0 6px 10px rgba(255, 255, 255, 0.6), 
                inset 0 -6px 10px rgba(0, 0, 0, 0.6);
        }

        .coin-symbol {
            font-size: 72px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 25px rgba(255,255,255,0.4);
            letter-spacing: 2px;
        }

        .coin-subtext {
            font-size: 15px;
            font-weight: 900;
            color: #fef08a;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Floating 3D Animation */
        .floating-text {
            position: fixed;
            color: #fef08a;
            font-size: 32px;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 15px rgba(245,158,11,0.8);
            animation: floatUp 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-50px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-110px) scale(1.1); }
        }

        /* Energy & Boost 3D Bar */
        .energy-boost-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
